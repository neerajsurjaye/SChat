apiVersion: apps/v1
kind: Deployment
metadata:
    name: auth

spec:
    replicas: 1
    selector:
        matchLabels:
            app: auth
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 2

    template:
        metadata:
            labels:
                app: auth

        spec:
            containers:
                - name: auth

                  image: 973314619659.dkr.ecr.us-east-1.amazonaws.com/neerajsurjaye/auth:latest
                  imagePullPolicy: Always

                  ports:
                      - containerPort: 5757
                  envFrom:
                      - configMapRef:
                            name: auth-configmap
                      - secretRef:
                            name: auth-secrets
