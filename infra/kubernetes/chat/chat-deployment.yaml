apiVersion: apps/v1
kind: Deployment
metadata:
    name: chat

spec:
    replicas: 1
    selector:
        matchLabels:
            app: chat
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 2

    template:
        metadata:
            labels:
                app: chat

        spec:
            containers:
                - name: chat

                  image: 973314619659.dkr.ecr.us-east-1.amazonaws.com/neerajsurjaye/chat:latest
                  imagePullPolicy: IfNotPresent

                  ports:
                      - containerPort: 5758
                  envFrom:
                      - configMapRef:
                            name: chat-configmap
